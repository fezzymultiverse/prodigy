name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Add Android platform
        run: |
          npx cap add android || true
          test -d android

      - name: Sync Capacitor
        run: npx cap sync android


      - name: Install SDK packages
        run: |
          SM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)"; yes | "$SM" --licenses || true
          "$SM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Bump versionCode
        run: |
          sed -i "/defaultConfig {/,/}/s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "/defaultConfig {/,/}/s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Configure Signing in build.gradle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text = p.read_text()
          if 'signingConfigs' not in text:
              text = text.replace(
                  "    buildTypes {\n",
                  """    signingConfigs {
              release {
                  storeFile file("release.keystore")
                  storePassword System.getenv("KEYSTORE_PASS")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEYSTORE_PASS")
              }
          }
          buildTypes {
          """,
                  1,
              )
          if 'signingConfig signingConfigs.release' not in text:
              text = text.replace(
                  "        release {\n",
                  "        release {\n            signingConfig signingConfigs.release\n",
                  1,
              )
          p.write_text(text)
          PY

      - name: Build signed release APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-app
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release (for Obtainium)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "${{ github.event.repository.name }}.apk"
          gh release create "V${{ github.run_number }}" "${{ github.event.repository.name }}.apk" \
            --title "V${{ github.run_number }}" --notes "Signed build ${{ github.sha }}"
